<style>
/* Layout: a Chinese family book — lacquer-red header with gold window-lattice trim, rice-paper pages, a chapter rail numbered in Chinese, cinnabar seal stamps */

const N = (t) => `<mark class="note">${t}</mark>`;
const T = (head, rows) => `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const chapters = [
{ id:'cover', group:'Front matter', n:'', title:'Cover and introduction', html: () => `
<div class="cover"><div class="cover-grid">
  <div class="bigseal" aria-hidden="true"><span>碗</span><span>中</span><span>之</span><span>爱</span></div>
  <div>
  <div class="eyebrow">A Family of Origin Analysis · Brendon Ban Ren Jie</div>
  <div class="title">Love Served in Rice Bowls</div>
  <p class="cn-title" lang="zh">碗中之爱</p>
  <p class="line">If they wrote a book about my family, this is what it would be called.</p>
  <dl class="meta-list">
    <div><dt>Program</dt><dd>Master of Professional Counseling, Universiti Malaya</dd></div>
    <div><dt>Course</dt><dd>PQA7020 Marriage and Family Counseling</dd></div>
    <div><dt>Lecturer</dt><dd>Profesor Dr. Melati binti Sumari</dd></div>
    <div><dt>Student ID</dt><dd>22059169</dd></div>
    <div><dt>Submitted</dt><dd>2 November 2026</dd></div>
  </dl>
  </div>
</div></div>
<h2>Why this title</h2>
<p class="lead">Nobody in my family says "I love you." I have never heard my father say it, and I am not sure his father ever said it to him. For a long time, I thought that meant it wasn't there.</p>
<p>But love is not always a sentence. Sometimes it is a behavior, repeated so often that you stop noticing it. My grandmothers cooked for whoever walked through the door. My mother asks "have you eaten?" in every phone call, even in the weeks when she is the one grieving. My father worked long hours so his sons could study, and he never once asked to be thanked.</p>
<p>This is what I have come to understand: some families speak in words, and some speak in what they do. Mine served its love quietly, in rice bowls, and left it to us to learn the language. This book is my attempt to finally read it.</p>
<p>This e-book examines three generations of my family using Bowen family systems theory and the genogram method (McGoldrick et al., 2020). Three patterns stand out:</p>
<div class="patterns">
  <div class="pat"><b>Fathers and sons</b>My father is distant from his father and close to his mother. I repeat the same pattern.</div>
  <div class="pat"><b>Women at the center</b>On both sides, mothers and grandmothers hold the closest bonds.</div>
  <div class="pat"><b>Illness and loss</b>Diabetes and high blood pressure on my father's side; cancer across my mother's family.</div>
</div>
<p>Use the chapter list to move through the book. The <a href="#appendix-a">timeline</a> and <a href="#appendix-b">genogram</a> are interactive.</p>`},

{ id:'birth', group:'My family system', n:'1', title:'Events around my birth', html: () => `
<p class="lead">I was born in 1998 into a young, ambitious family that was building its future while the region's economy was shaking.</p>
<p><b>My parents built their careers first.</b> In 1993 my mother was studying in Australia while my father was in Malaysia, so their relationship began with distance and sacrifice. Both graduated abroad and spent the mid-1990s building careers in accounting and finance. Around 1995 they moved from Kedah to Kuala Lumpur for work, and in 1998 they married, the same year I was born. In a traditional Chinese family, education and a stable profession come before comfort, and my parents lived that value fully.</p>
<p><b>I was born during the Asian financial crisis.</b> The crisis of 1997–98 hit Malaysia hard, and it affected both my parents' jobs, so I was born into a household under real financial strain. That pressure may be part of why, a year later, there was no one at home to care for me. It also reinforced a family message I absorbed early: security is never guaranteed, so work hard and save.</p>
<p><b>I was sent to my grandparents as a baby.</b> In 1999, when I was one, there was no one at home to care for me, so I was sent to live with my paternal grandparents in Sungai Petani. Between ages two and five I traveled back and forth between Sungai Petani and Kuala Lumpur, and a nanny looked after me while my parents worked.</p>
<h2>Impact on me</h2>
<p>I was one year old when I was sent away. I don't remember the day, but the body often remembers what the mind was too young to keep. My parents were not abandoning me. They were doing what families like ours have always done: giving up the present so their child could have a better future.</p>
<p>A baby does not understand sacrifice, though. A baby only understands who is there. For me, it was my grandparents, then a nanny, then the long road between Sungai Petani and Kuala Lumpur. So I adapted. I learned to be easy to care for, to not cry too much, to settle into whoever was holding me.</p>
<p>What we call our strengths are often the ways we once learned to survive. People describe me as calm and independent, and I think that calm was born on those journeys. It makes me a steady presence for clients. It also means the hardest thing for me is not being strong. It is letting someone hold me when I am the one who needs it.</p>
<p>When I cried at my grandparents' house, my grandfather never asked what was wrong. He would put me in the car and drive me around the town until I was quiet. I still don't know what I was crying for. Maybe I missed my mother and father. Maybe I was too small to know. What I remember is the car, the streets of Sungai Petani passing by the window, and him beside me, saying nothing.</p>
<p>It took me years to understand that drive. This is the same man my father has always been distant from, the same dashed line on my genogram. And yet he knew exactly what to do with a crying child. Not everyone who loves you has the words for it. Some people can only offer you the road, and trust that you will feel what they cannot say.</p>
<p>See the <a href="#appendix-a">interactive timeline</a> for each year from 1993 to 2003.</p>`},

{ id:'context', group:'My family system', n:'2', title:'Cultural and historical context', html: () => `
<p class="lead">My family is Malaysian Chinese, rooted in the trading communities of northern Malaysia, and in two generations it moved from small business into professional careers.</p>
${T(['Area','My family','Impact on me'],[
['Culture and language','Hokkien on my grandfathers’ and maternal grandmother’s side, Cantonese on my paternal grandmother’s side. At home we speak English and Mandarin; my father speaks Hokkien only with his father.','I move between languages and cultures easily, which helps me build rapport with diverse clients. But Hokkien, the language my father shares with his father, did not pass down to my brothers and me. Some of what passes between them happens in a language our generation does not use at home.'],
['Immigration','According to my parents, my great-grandparents came from southern China, most likely Fujian and Guangdong, in the early 1900s. The details were never written down.','I carry a migrant’s message: work hard, save, and give the next generation a better start.'],
['Spirituality','Buddhist–Taoist practices: ancestor worship at the family altar, Qing Ming tomb-sweeping and Chinese New Year rituals. My paternal grandparents lead them; my mother’s side follows them less closely.','Rituals taught me respect for elders and ancestors, and a sense of belonging to something bigger than myself. Because my father’s side leads them, they also tie me to the side of the family where words are fewest.'],
['Geography','Both grandparent families lived in Kedah; my mother’s roots are in Sabah. My parents later moved from Kedah to Kuala Lumpur.','Growing up between a small northern town and the capital, I learned to adapt but felt pulled between two homes.'],
['Careers','Both grandfathers were traders with Form 3 education; both grandmothers were housewives. My mother’s siblings were mostly business owners. My parents became an accountant and a financial analyst, both educated abroad.','Education is seen as the way up. Choosing counseling meant stepping off the family’s business and finance path.'],
['Historical events','The 1969 racial riots and the New Economic Policy shaped Chinese Malaysians’ sense that they must rely on themselves; the Asian financial crisis came the year I was born.','I learned early to value stability and self-reliance, and to worry about the future.']])}
<p>My family's context taught me that security comes from hard work, education and family loyalty. In counseling, this helps me understand clients from collectivist and migrant families. It also reminds me not to assume every client shares my family's focus on achievement.</p>`},

{ id:'members', group:'My family system', n:'3', title:'Family members and roles', html: () => `
<p class="lead">My mother is the emotional center of the family, my father is its provider and authority, and my grandparents anchor both sides.</p>
${T(['Person','Role in the family','Influence on me'],[
['Mother (b. 1969)','Emotional hub and peacemaker. Financial analyst with a Master’s in IT. The youngest of ten, she lost her father the year she was born. Close to her mother, her siblings, my father and me.','My closest relationship. She taught me empathy, resilience and curiosity. I often became her confidant.'],
['Father (b. 1969)','Provider and rule-maker. Accountant. The only son among three sisters, close to his mother, distant from his father.','Our relationship is distant. I learned that men show love through providing, not talking. I still seek his approval.'],
['Benny (b. 2004)','Achiever. Chemistry graduate who studied abroad, now working.','We are distant. I studied architecture in Australia from 2016 until I came home during the pandemic in 2020, and that same year he left to study abroad. With our six-year gap, we have spent most of his teenage years in different countries.'],
['Branson (b. 2010)','The baby of the family. Student, active in St John Ambulance.','We are close. With a 12-year gap, I often act as a mentor or second parent.'],
['Paternal grandfather (b. 1942)','Patriarch. Retired Hokkien trader, interested in economics, finance and automobiles.','Represents traditional male authority. I lived with him as a baby, and whenever I cried he drove me around town until I settled. My father’s distance from him mirrors mine from my father.'],
['Paternal grandmother (1939–2017)','Nurturer. Cantonese housewife skilled at hairdressing, cooking, baking, gardening and sewing.','Showed love through food and care. I lived with her and my grandfather as a baby, and we stayed very close. When she died in 2017, I broke down. It was the first great loss of my adult life.'],
['Maternal grandfather (1926–1969)','Absent ancestor. Hokkien trader who died of cancer the year my mother was born.','His early death shaped my mother’s life and the family’s fear of loss.'],
['Maternal grandmother (1929–2024)','Matriarch. Raised ten children alone after being widowed.','A model of strength and sacrifice.'],
['Father’s three sisters','Close supporters of my father: two government servants and a bank teller.','Show how a family rallies around its only son.'],
['Mother’s nine siblings','A large, close sibling group, mostly business owners. Four have died of cancer.','Taught me about loyalty and belonging, and about repeated grief.']])}
<p>Click any person on the <a href="#appendix-b">genogram</a> to see their details.</p>`},

{ id:'birth-order', group:'My family system', n:'4', title:'Birth order', html: () => `
<p class="lead">I am the eldest son of three boys, born six years before Benny and twelve years before Branson. In a traditional Chinese family, this position carries more weight than almost any other.</p>
<p><b>The eldest son's role.</b> The eldest son (长子) is expected to set an example, carry the family name, look after younger siblings and eventually care for aging parents. I was the only child for six years, so I received my parents' full attention and full expectations. My grandparents added their own. Growing up, they often compared us with my cousins, the children of my father's sisters: whose grades were better, whose life was going further. As the eldest grandson, I felt I was always being measured. I learned to work hard partly to be good enough, and I still find it hard to feel that what I achieve is enough.</p>
<p><b>The large age gaps.</b> By the time Branson was born I was twelve and already helping to look after him. This made me a "parentified" older brother: protective, responsible and quick to step in. With Benny, the gap meant we never shared the same world. Then, just as he was becoming old enough to be a real companion, I left to study architecture in Australia in 2016. When I came home during the pandemic in 2020, he left. We kept missing each other, and the distance settled in.</p>
<p><b>My parents' birth order.</b> My father was the third of four children and the only son among three sisters, so he likely carried the family's hopes, much like I do now. My mother was the youngest of ten, protected by older siblings, which may explain why closeness matters so much to her. When a youngest child marries an only son, the first-born child often becomes the helper. I believe I filled that role.</p>
<h2>How it affects me now</h2>
<ul><li><b>Strengths:</b> responsible, dependable and comfortable leading. I naturally take care of others, which drew me to counseling.</li>
<li><b>Challenges:</b> perfectionism, guilt when I disappoint my parents, and putting others first. I sometimes over-function and then feel tired or resentful.</li></ul>
<p>In counseling, I need to watch for the urge to rescue clients, especially younger clients or those who remind me of my brothers.</p>`},

{ id:'values', group:'How my family works', n:'5', title:'Values, customs and beliefs', html: () => `
<p class="lead">My family's values rest on filial piety (孝顺, <i>xiào shùn</i>): respect for elders, duty to family and sacrifice for the next generation. ${N('Check: adjust any row that doesn’t fit.')}</p>
${T(['Dimension','Where my family sits','How it influenced me'],[
['Socioeconomic class','Rose from working-class traders to upper-middle-class professionals educated abroad.','Grateful for opportunities, and pressured to justify my parents’ sacrifices.'],
['Child- vs adult-centerd','Adult-centerd. Children obey; parents decide.','I defer to authority and can struggle to voice disagreement.'],
['Schedules vs natural rhythms','Schedules. Work, study and tuition come first.','Organized and disciplined, but rest feels guilty.'],
['Now vs future','Strongly future-oriented.','I plan well but can neglect the present and my wellbeing.'],
['Male vs female focus','Male-focused in status, female-centerd in emotional life.','I carry the eldest son’s expectations; my emotional support comes from women.'],
['Open vs closed','Closed about problems; open to travel and food.','I enjoy exploring but keep struggles private.'],
['Individual vs collective','Collective. Family face (面子) comes first.','I weigh how my choices affect my family, sometimes more than what I want.']])}
<h2>Customs and traditions</h2>
<p>Chinese New Year reunion dinners, red packets (<i>ang pao</i>), visiting grandparents in Kedah, and traveling together. At Qing Ming we sweep our ancestors' tombs, and through the year we pray at the family altar, led by my paternal grandparents. Food is at the center of every gathering, and "have you eaten?" is how my family says "I care about you."</p>
<h2>Unspoken rules</h2>
<ul><li>Don't air dirty laundry (家丑不可外扬): family problems stay in the family.</li><li>Respect your elders, even when you disagree.</li><li>Study hard and choose a stable career.</li><li>Don't show weakness; feelings are private.</li></ul>
<p>These rules gave me discipline, loyalty and respect. They also made it harder to talk openly about my mental health.</p>`},

{ id:'communication', group:'How my family works', n:'6', title:'Communication patterns', html: () => `
<p class="lead">Communication in my family is indirect, top-down and practical. We talk about food, school, work and plans, but rarely about feelings.</p>
<p><b>Verbal style.</b> Care is expressed through "have you eaten?", "did you study?" or "wear more clothes", rather than "I love you" or "I'm proud of you." Criticism is more common than praise, because praise is thought to make children lazy.</p>
<p><b>Nonverbal.</b> A look, a sigh or silence from my father tells me he is unhappy. My mother shows love by cooking my favorite food or cutting fruit for me. Physical affection is rare, especially between my father and me.</p>
<p><b>Direction.</b> Communication flows from parents down to children. My mother often acts as the go-between: when my father is upset with me, I usually hear it from her. This is a classic triangle (Kerr &amp; Bowen, 1988).</p>
<p><b>Conflict resolution.</b> We avoid open conflict. People go quiet, withdraw or wait for it to pass, then act as if nothing happened. ${N('Check: does anyone shout or use the silent treatment?')}</p>
<p><b>Alliances.</b> My mother and I form a close alliance, as do my mother and her siblings, and my father with his mother and sisters. Branson and I are close; Benny is more independent.</p>
<p><b>Family secrets.</b> Money problems, illness and mental health are kept private. My own diagnosis is something my family finds hard to talk about openly. ${N('Your choice: keep, or change to “emotional struggles”.')}</p>
<h2>Impact on me</h2>
<p>I became skilled at reading moods and unspoken messages, which helps me notice clients' nonverbal cues. I also learned to avoid conflict and hide my feelings. As a counselor, I am learning to name emotions out loud and to stay present when clients express anger.</p>`},

{ id:'cohesion', group:'How my family works', n:'7', title:'Family cohesion', html: () => `
<p class="lead">My family is close and loyal, but the closeness is uneven: it runs strongly through the women and is thin between fathers and sons.</p>
<p><b>Closeness.</b> Using Olson's circumplex model (Olson, 2000), my family sits between "connected" and "enmeshed" on my mother's side and closer to "separated" on the father–son line. No one has cut off contact, but the father–son distance repeats across two generations.</p>
<p><b>Loyalty.</b> Loyalty means showing up: Chinese New Year, visiting relatives, supporting each other during illness, never shaming the family in public. As the eldest son, I am expected to succeed, stay close and eventually care for my parents. ${N('Check: is that true for you?')}</p>
<p><b>Warmth.</b> Shown through actions: cooking, buying what we need, paying for education, turning up at the hospital. My mother's side gathers often; my father's warmth is quieter.</p>
<p><b>Cut-offs.</b> None formally. My distance from my father and Benny is a polite emotional distance, which Bowen describes as managing anxiety by reducing contact rather than resolving it.</p>
<h2>Impact on me</h2>
<p>There is a sentence I have never said to my father, and I suspect he never said it to his: <i>I want to know you.</i> We sit at the same table every Chinese New Year. We talk about work, the traffic, the food. Underneath it is a whole conversation neither of us knows how to begin.</p>
<p>When I drew my genogram, I saw the dashed line between my father and his father, and then the same dashed line between my father and me. That was the moment something softened. His silence was never a judgment of me. It was something he was handed, the way it was handed to me. We don't choose the patterns we inherit. We only choose whether we keep passing them on.</p>
<p>I know my family will support me in a crisis, but the closeness comes with expectations. With my mother, closeness can become over-involvement, where I absorb her worries. With my father, I long for connection but don't know how to start. In practice, I connect easily with warm clients and need to work harder with distant ones, especially fathers and older men.</p>`},

{ id:'life-events', group:'How my family works', n:'8', title:'Life cycle events', html: () => `
<p class="lead">The biggest shifts were births that changed my role, moves between Kedah and Kuala Lumpur, and a long series of losses on my mother's side.</p>
${T(['Year','Age','Event','Impact on me'],[
['c. 1995','−3','Parents moved from Kedah to Kuala Lumpur for work','I was born in Kedah but grew up between KL and my grandparents’ home'],
['1998','0','My parents married; I was born in Sungai Petani','I arrived as my parents were still starting their marriage and careers'],
['1999–2003','1–5','Lived with grandparents, then moved between Sungai Petani and KL with a nanny','Learned to adapt; strong bonds with grandparents and mother'],
['2000','2','Mother’s sister died of cancer','Shaped the grief my mother carried'],
['2004','6','Benny was born','Began my big-brother role'],
['2010','12','Branson was born','Took on caretaking and mentoring'],
['2016–2020','18–22','I studied architecture in Australia','I missed most of Benny’s early teenage years'],
['2017','19','Paternal grandmother and mother’s eldest sister died','I was very close to my grandmother and broke down when she died'],
['2020','22','I came home during the COVID-19 pandemic; Benny left to study abroad','We missed each other again, and our distance grew'],
['2021','23','Mother’s sister died of cancer','Watched my mother grieve while coping with my own challenges'],
['2024','26','Maternal grandmother died','The family lost its matriarch'],
['2025','27','Mother’s brother died of cancer','Deepened my awareness of grief and health risks'],
['2025','27','Started my Master of Professional Counseling at Universiti Malaya','Began to see my family through a new lens'],
['2026','28','Diagnosed with schizophrenia and depression','A turning point in my self-understanding '+N('Your choice')]])}
<p>My mother was born in 1969, the same year her father died of cancer. She never heard his voice. She grew up the youngest of ten, raised by a widowed mother who held the whole family together with her hands. Between 2000 and 2025, she buried four of her siblings, three sisters and a brother, all to the same illness that took the father she never met. In 2024, in the middle of that grief, she lost her mother too.</p>
<p>I have watched her stand at funerals and then come home and ask me if I have eaten. I used to think that was avoidance. Now I see it differently. Grief does not always look like tears. Sometimes it looks like someone who has lost too much, refusing to stop caring for the people who are still here. That is the bravest thing I know.</p>
<p>In 2017, grief reached me too. My paternal grandmother, the woman whose house I lived in as a baby, passed away. We had always been very close, and when she died I broke down completely. In a family where grief is folded quietly into cooking and carrying on, I did not know where to put mine. I think that is what grief is, in the end: love that has nowhere left to go. Hers had been served to me without words for nineteen years, and suddenly the table was empty.</p>
<p>In family life cycle terms (McGoldrick et al., 2016), my family is launching children while losing its oldest generation, and my parents face diabetes and high blood pressure at the same time as grief. As the eldest son, I am moving into a role where I may soon support my parents.</p>`},

{ id:'strengths', group:'How my family works', n:'9', title:'Strengths and vulnerabilities', html: () => `
<p class="lead">My family's greatest strengths are resilience, loyalty and a commitment to education; its main vulnerabilities are inherited illness, repeated grief and emotional silence.</p>
<h2>Strengths</h2>
${T(['Strength','Evidence','How it influenced me'],[
['Resilience','My maternal grandmother raised ten children alone after being widowed in 1969.','I believe hard times can be survived, and I bring that hope to clients.'],
['Loyalty','My mother’s siblings stay close; my father’s sisters support him.','I know I have a safety net.'],
['Education and work ethic','Two generations rose from Form 3 traders to professionals.','I am disciplined and motivated to learn.'],
['Practical care','Grandmothers and mother show love through cooking and caring.','I show care through action.'],
['Openness to the world','Travel, new food, studying abroad.','I am curious and adaptable.']])}
<h2>Vulnerabilities</h2>
${T(['Vulnerability','Evidence','How it influenced me'],[
['Inherited illness','Diabetes and high blood pressure in my paternal grandparents, father and two aunts; high blood pressure in my mother; cancer in five maternal relatives.','I worry about my parents’ health and my own risk.'],
['Repeated grief','My mother lost her father at birth, then four siblings and her mother between 2000 and 2025.','I am sensitive to loss and can over-protect my mother.'],
['Emotional silence and stigma','Feelings and mental health are rarely discussed.','It was harder to seek help for my own mental health.'],
['Mental illness','I live with schizophrenia and depression. '+N('Your choice'),'I know what it is like to be a client.'],
['Father–son distance','Repeats across two generations.','An unmet need for my father’s approval.'],
['Pressure to achieve','High expectations on the eldest son.','Perfectionism and fear of failure.']])}
<p>The same loyalty that protects us also keeps problems hidden, and the same work ethic that lifted us leaves little room for rest and feelings.</p>`},

{ id:'influence', group:'How my family works', n:'10', title:'How I influenced my family', html: () => `
<p class="lead">Influence runs both ways: my family shaped me, and I have changed my family too.</p>
<p><b>My birth created a new generation.</b> It made my parents into parents and pulled my grandparents into active care, drawing the generations closer.</p>
<p><b>I became my mother's confidant.</b> This supported her through her losses, but it also kept part of the emotional load on me, which may have let my father stay at a distance.</p>
<p><b>I became a second parent to Branson.</b> This eased my parents' workload and gave him a role model, and added to my sense of responsibility.</p>
<p><b>I chose a different path, twice.</b> My grandparents and my mother's siblings were traders and business owners, and my parents chose accounting and finance. In 2016 I went to Australia to study architecture, the same country where my mother had studied before I was born. In 2025 I changed direction again and began my Master of Professional Counseling, which took me further still from the family's tradition of business and money. ${N('Check: how did your parents react?')}</p>
<p><b>I brought mental health into the open.</b> My diagnosis forced my family to face a topic traditional Chinese families often hide. ${N('Your choice: keep or remove.')}</p>
<p><b>I am starting to challenge old patterns.</b> In small ways, like asking my father about his life or saying how I feel, I am trying to change the pattern rather than repeat it. ${N('Check: add a real example.')}</p>`},

{ id:'presenting-problem', group:'Practice', n:'11', title:'A problem that brings us to therapy', html: () => `
<p><i>This scenario is fictitious, but it is built on real patterns in my family.</i></p>
<h2>The problem</h2>
<p>Branson, now 16, has become withdrawn, is skipping school and spends most nights gaming. His school counselor refers the family. Branson is the identified patient, but the real problem is a family that cannot grieve together.</p>
<h2>Context</h2>
<p>In 2024 my maternal grandmother died, and in 2025 my mother lost her fourth sibling to cancer, on top of losing her father the year she was born. She has become tired and anxious about everyone's health. My father works longer hours. I have become my mother's main support. Benny is busy with his own life. Branson feels the tension but has no words for it.</p>
<h2>Who comes, and who resists</h2>
<p>My mother comes willingly. I come and try to "help" the counselor. My father is reluctant ("family matters stay at home"). Benny says he is too busy. Branson comes because he is told to.</p>
<h2>Why it isn't solving itself</h2>
<ul>
<li><b>Detouring through a symptom.</b> Worrying about Branson is easier than feeling the loss (Minuchin, 1974).</li>
<li><b>A rigid triangle.</b> My mother turns to me, not my father, so the couple never grieves together (Kerr &amp; Bowen, 1988).</li>
<li><b>Over- and under-functioning.</b> The more I help, the less my father needs to step in.</li>
<li><b>Family rules.</b> "Don't air dirty laundry" delays help until a child's problem forces it.</li>
<li><b>Multigenerational transmission.</b> My mother learned to cope with loss by staying busy, not talking, and passes that style down.</li>
</ul>
<h2>Who benefits from no change</h2>
<p>Everyone avoids pain in the short term: my father avoids emotional talk, my mother avoids her grief, and I keep my role as the "good son." Branson and the couple relationship carry the cost.</p>`},

{ id:'patterns', group:'Practice', n:'12', title:'Patterns and my practice', html: () => `
<p class="lead">My genogram shows four patterns repeating across three generations, and each could affect how I work with clients. Try the filters on the <a href="#appendix-b">genogram</a> to see them.</p>
${T(['Pattern','Generations','How it could show up in practice'],[
['Father–son distance; sons close to mothers','Grandfather → father → me','Easier rapport with mothers, harder with fathers. I may side with a mother against a distant father.'],
['Women as the emotional center','Both grandmothers → mother and aunts','I may expect women to carry the emotional work, or overlook men’s quieter care.'],
['Repeated illness and loss','Cancer, diabetes, high blood pressure on both sides','Clients facing illness or grief may stir my own fears.'],
['Eldest-son and caretaker roles','Father as only son; me as eldest','I may rescue clients or take too much responsibility.']])}
<h2>Anxiety triggers</h2>
<ul><li>Conflict, raised voices or a disappointed authority figure.</li><li>Clients describing illness, hospitals or the death of a parent or sibling.</li><li>Distant or hard-to-read clients, especially older men.</li><li>Feeling that I am failing a client.</li></ul>
<p>${N('Check: add or remove triggers.')}</p>
<h2>How my anxiety shows</h2>
<p>I over-function: I talk more, give advice too quickly or smooth over conflict. Or I go quiet and withdraw, the way my family handles tension.</p>
<h2>Unresolved issues and boundaries</h2>
<p>An unmet wish for my father's approval, unspoken grief, my role as my mother's confidant, and living with a mental illness that makes stress hit harder ${N('Your choice')}. I find saying no hard, which could mean running over time or taking clients' problems home.</p>`},

{ id:'self-care-plan', group:'Practice', n:'13', title:'Self-monitoring plan', html: () => `
<p class="lead">My plan has three parts: notice my reactions early, use support regularly, and look after my own mental and physical health.</p>
${T(['Strategy','What I will do','How often'],[
['Clinical supervision','Bring cases involving distant fathers, grief, illness or conflict; ask my supervisor to flag rescuing.','Weekly'],
['Personal therapy and treatment','Continue my psychiatric care and take my medication as prescribed, and keep seeing my own counselor, especially during stressful periods. Tell my psychiatrist early if work stress starts to affect my sleep or mood.','Ongoing'],
['Reflective journaling','After hard sessions, note what I felt and whether it came from the client or my family.','After each; review weekly'],
['Early warning signs','Poor sleep, withdrawing, irritability, low mood, over-working. Two or more for a week → tell my supervisor and clinician.','Daily check'],
['Genogram check-in','Sketch each new family’s genogram and note overlaps with mine.','Each new family'],
['Self-care','Sleep, basketball or walking, healthy eating to lower my diabetes and blood pressure risk, time with friends.','Daily and weekly'],
['Peer consultation','Discuss cultural issues with Chinese Malaysian families.','Monthly'],
['Continued learning','Bowen theory, grief counseling, culturally responsive practice.','One workshop a year']])}
<h2>In the moment</h2>
<ol><li>Pause and take a slow breath.</li><li>Name the feeling ("this father reminds me of my dad").</li><li>Return to the client's experience.</li><li>Note it for journaling and supervision.</li></ol>
<h2>Boundaries I will keep</h2>
<ul><li>Start and end on time.</li><li>Understand before advising.</li><li>Clients own their change; I support it.</li><li>Take my family's problems to my own support, not into the room.</li></ul>`},

{ id:'learned', group:'Practice', n:'14', title:'What I learned', html: () => `
<p class="lead">Many things I thought were "just my personality" are family patterns that began long before me.</p>
<p><b>About myself.</b> My distance from my father is not simply a personal failure; he has the same distance from his father. My caretaking comes partly from being the eldest son and from early years moving between homes. I better understand why asking for help, including for my mental health, has felt so hard.</p>
<p><b>About my family.</b> My mother lost her father before she could know him and has kept losing the people closest to her; her closeness to me makes more sense now. I see my father with more compassion: he may never have learned another way to be close. Benny's distance comes from timing, not a lack of care: a six-year gap, and then years when one of us was always overseas.</p>
<h2>Areas for growth</h2>
<ul><li>Build a more open relationship with my father, one conversation at a time.</li><li>Reconnect with Benny.</li><li>Keep healthy boundaries with my mother while staying close.</li><li>Rest and ask for help without guilt.</li><li>Keep looking after my mental and physical health.</li></ul>
<h2>How I will work with families</h2>
<p>I will attend to culture, especially filial piety, face and mental health stigma in Asian families. I will respect care shown through actions, make a special effort to engage fathers and quieter members, and use the genogram to show families that their struggles have a history, and that patterns can change.</p>
<h2>If I could say it out loud</h2>
<p>${N('Check: change any word so these lines sound like you.')}</p>
<p><i>To my father:</i> I see now that the distance between us did not start with us. You carried it from your father, and I carried it from you. I don't want to hand it to anyone else. I would like to try, slowly, to meet you somewhere in the middle.</p>
<p><i>To my mother:</i> You never knew your father, and you have spent your whole life holding everyone else together. Thank you for every bowl of rice. I understand now that each one was a sentence.</p>
<p><i>To my grandmothers:</i> You raised your families with your hands. I am still eating from what you planted.</p>
<p><i>To my grandfather:</i> Thank you for every drive around Sungai Petani. I understand now that the car was your way of holding me.</p>
<p><i>To my brothers:</i> I hope we can be the generation that says the quiet parts out loud.</p>
<p>This assignment taught me something I will carry into every session: you cannot guide anyone through a place you are unwilling to go yourself. I can only sit with a family's pain if I have first learned to sit with my own. Healing, I am learning, is not about becoming someone new. It is about understanding where you came from, and choosing, gently, what you will carry forward. My family has always served its love in silence. I am learning to say it out loud.</p>`},

/* ---------- build ---------- */
const $ = (s) => document.querySelector(s);
const rail = $('#rail'), page = $('#page');
const CN = ['','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四'];
const cnLabel = c => c.id === 'cover' ? '序' : c.id === 'references' ? '参考文献' : c.n === 'A' ? '附录甲' : c.n === 'B' ? '附录乙' : '第' + CN[+c.n] + '章';
const cnShort = c => c.id === 'cover' ? '序' : c.id === 'references' ? '文' : c.n === 'A' ? '甲' : c.n === 'B' ? '乙' : CN[+c.n];
let state = { geno: 'all', sel: 'me', year: 1998 };

function buildRail() {
  let html = '', g = '';
  chapters.forEach(c => {
    if (c.group !== g) { g = c.group; html += `<h3>${g}</h3>`; }
    html += `<a href="#${c.id}" data-id="${c.id}"><span class="n" lang="zh">${cnShort(c)}</span><span>${c.title}</span></a>`;
  });
  rail.innerHTML = html;
}

function render(id) {
  const i = Math.max(0, chapters.findIndex(c => c.id === id));
  const c = chapters[i];
  const prev = chapters[i-1], next = chapters[i+1];
  const head = c.id === 'cover' ? '' : `<div class="chap"><span class="cn" lang="zh">${cnLabel(c)}</span><span class="eyebrow">${c.n ? (c.group === 'Appendices' ? 'Appendix ' + c.n : 'Chapter ' + c.n) : c.group}</span></div><h1>${c.title}</h1><div class="h1rule"></div>`;
  page.innerHTML = head + c.html() + `<nav class="pager">
    <a class="prev" href="#${prev ? prev.id : ''}" ${prev ? '' : 'hidden'}><small lang="zh">上一章 · Previous</small>${prev ? prev.title : ''}</a>
    <a class="next" href="#${next ? next.id : ''}" ${next ? '' : 'hidden'}><small lang="zh">下一章 · Next</small>${next ? next.title : ''}</a></nav>`;
  rail.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id === c.id));
  $('#progress').style.width = ((i + 1) / chapters.length * 100) + '%';
  document.body.classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded','false');
  if (c.id === 'appendix-a') initTimeline();
  if (c.id === 'appendix-b') initGeno();
  window.scrollTo(0, 0);
}

function initTimeline() {
  const box = $('#years');
  box.innerHTML = years.map(e => `<button class="yr ${e.t.startsWith('No') ? '' : 'has'} ${e.y===1998?'birth':''}" role="tab" data-y="${e.y}" aria-selected="false">${e.y}<small>${e.a>0?'age '+e.a:e.a===0?'birth':e.a}</small></button>`).join('');
  box.addEventListener('click', ev => { const b = ev.target.closest('.yr'); if (b) showYear(+b.dataset.y); });
  showYear(state.year);
}
function showYear(y) {
  state.year = y;
  const e = years.find(v => v.y === y);
  document.querySelectorAll('.yr').forEach(b => { const on = +b.dataset.y === y; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  $('#yearCard').innerHTML = `<div class="meta">${y} · ${e.a===0?'my birth':e.a<0?Math.abs(e.a)+' years before my birth':'age '+e.a}${e.w?' · affected: '+e.w:''}</div><h4>${e.t}</h4><p>${e.d}</p>`;
}

function shape(id, p) {
  const fill = p.c ? `var(--c-${p.c})` : 'var(--sheet)';
  let s = '';
  if (p.s === 'm') {
    s = `<rect class="shape" x="${p.x-p.z/2}" y="${p.y-p.z/2}" width="${p.z}" height="${p.z}" fill="${fill}"/>`;
    if (p.mh) s = `<rect x="${p.x-p.z/2-4}" y="${p.y-p.z/2-4}" width="${p.z+8}" height="${p.z+8}" fill="none" stroke="var(--ink-soft)"/>` + `<rect class="shape" x="${p.x-p.z/2}" y="${p.y-p.z/2}" width="${p.z}" height="${p.z}" fill="var(--cobalt-wash)"/><rect x="${p.x-p.z/2}" y="${p.y-p.z/2}" width="${p.z/2}" height="${p.z}" fill="var(--c-mh)" pointer-events="none"/>`;
  } else s = `<circle class="shape" cx="${p.x}" cy="${p.y}" r="${p.z}" fill="${fill}"/>`;
  if (p.dead) { const d = p.s==='m' ? p.z/2 : p.z*0.68; s += `<path class="xx" d="M${p.x-d} ${p.y-d}L${p.x+d} ${p.y+d}M${p.x+d} ${p.y-d}L${p.x-d} ${p.y+d}"/>`; }
  let t = '';
  if (p.top) t += `<text x="${p.x}" y="34" text-anchor="middle" font-size="11.5">${p.top[0]}</text><text class="q" x="${p.x}" y="50" text-anchor="middle" font-size="11.5">${p.top[1]}</text>`;
  if (p.yr) p.yr.forEach((v, k) => t += `<text class="q" x="${p.x}" y="${212+k*14}" text-anchor="middle" font-size="11.5">${v}</text>`);
  if (p.low) t += `<text x="${p.x}" y="346" text-anchor="middle" font-size="13" font-weight="600">${p.low[0]}</text><text class="q" x="${p.x}" y="361" text-anchor="middle" font-size="11.5">${p.low[1]}</text>`;
  return `<g class="node" tabindex="0" role="button" aria-label="${p.name}" data-id="${id}">${s}${t}</g>`;
}
function initGeno() {
  const lines = L.map(([d,k,tags]) => `<path class="${k}" d="${d}" data-tags="${tags.join(' ')}"/>`).join('');
  const labels = `<text x="112" y="262" text-anchor="middle" font-size="13" font-weight="600" class="node-lbl" data-for="dad">Father · 1969</text><text class="q" x="112" y="278" text-anchor="middle" font-size="11.5" data-for="dad">Accountant</text>
   <text x="638" y="262" text-anchor="end" font-size="13" font-weight="600" data-for="mom">Mother · 1969</text><text class="q" x="638" y="278" text-anchor="end" font-size="11.5" data-for="mom">Financial analyst</text>`;
  $('#svgbox').innerHTML = `<svg viewBox="0 0 680 410" role="img" aria-label="Three-generation family genogram">${lines}${labels}${Object.entries(P).map(([id,p]) => shape(id,p)).join('')}</svg>`;
  $('#filters').innerHTML = FILTERS.map(f => `<button class="chip" data-k="${f.k}" aria-pressed="false">${f.label}</button>`).join('');
  $('#filters').addEventListener('click', ev => { const b = ev.target.closest('.chip'); if (b) setFilter(b.dataset.k); });
  const svg = $('#svgbox svg');
  svg.addEventListener('click', ev => { const n = ev.target.closest('.node'); if (n) select(n.dataset.id); });
  svg.addEventListener('keydown', ev => { const n = ev.target.closest('.node'); if (n && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); select(n.dataset.id); } });
  setFilter(state.geno); select(state.sel);
}
function setFilter(k) {
  state.geno = k;
  document.querySelectorAll('.chip').forEach(c => { const on = c.dataset.k === k; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
  $('#filterNote').textContent = FILTERS.find(f => f.k === k).note;
  const all = k === 'all';
  document.querySelectorAll('#svgbox .node').forEach(n => { const hit = all || P[n.dataset.id].tags.includes(k); n.classList.toggle('dim', !hit); n.classList.toggle('lit', !all && hit); });
  document.querySelectorAll('#svgbox path[data-tags]').forEach(p => { const hit = all || p.dataset.tags.split(' ').includes(k); p.classList.toggle('dim', !hit); p.classList.toggle('lit', !all && hit); });
  document.querySelectorAll('#svgbox [data-for]').forEach(t => { const hit = all || P[t.dataset.for].tags.includes(k); t.classList.toggle('dim', !hit); });
}
function select(id) {
  state.sel = id;
  const p = P[id];
  document.querySelectorAll('#svgbox .node').forEach(n => n.classList.toggle('sel', n.dataset.id === id));
  const cond = {dh:'Diabetes and high blood pressure',di:'Diabetes',hb:'High blood pressure',ca:'Cancer'}[p.c];
  $('#who').innerHTML = `<div class="meta"><b>Selected</b>${cond ? ' · ' + cond : ''}${p.dead ? ' · Deceased' : ''}</div><h4>${p.name}</h4><p>${p.info}</p><p><b>Relationships:</b> ${p.rel}</p>`;
}

/* notes toggle */
const nt = $('#notesToggle');
try { if (localStorage.getItem('rb-notes') === 'off') nt.checked = false; } catch (e) {}
const applyNotes = () => { document.body.classList.toggle('hide-notes', !nt.checked); try { localStorage.setItem('rb-notes', nt.checked ? 'on' : 'off'); } catch (e) {} };
nt.addEventListener('change', applyNotes); applyNotes();

$('#menuBtn').addEventListener('click', () => { const open = document.body.classList.toggle('nav-open'); $('#menuBtn').setAttribute('aria-expanded', open); });

buildRail();
const route = () => render((location.hash || '#cover').slice(1));
window.addEventListener('hashchange', route);
route();
</script>
